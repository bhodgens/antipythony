# Clippy configuration - robustness-ci 02.01 (lint policy).
#
# Currently no option overrides are needed. The workspace lint levels
# (unwrap_used=warn, dbg_macro=deny, todo=warn) live in root Cargo.toml
# [workspace.lints.clippy]; grandfathered allowances are inner-attribute
# crate-root allow(clippy::unwrap_used) in ap-obj / ap-run lib crates
# (see plans/robustness-ci/02-lint-gates/PROGRESS.md tally).
#
# Reference for available keys: https://doc.rust-lang.org/clippy/configuration.html
# Deliberately minimal - add e.g. too-many-lines-threshold only when a leaf
# actually needs it.
#
# Issue #15 unsafe policy (docs/unsafe-inventory.md):
#   - undocumented_unsafe_blocks is set to "deny" in root Cargo.toml
#     [workspace.lints.clippy] (flip landed with issue #24, 2026-11-27,
#     after waves #21/#22/#23 + #27 burned the backlog to 0, verified
#     workspace-wide including test targets). Every unsafe block and
#     unsafe impl in every linted crate needs a `// SAFETY: ...` comment
#     directly above it; the lint makes an undocumented block a hard
#     build error.
#   - Zero-unsafe crates are pinned with #![forbid(unsafe_code)] at the lib.rs
#     first line: ap-pack, ap-host, ap-conform, ap-codegen-wasm, ap-cli,
#     xtask, ap-ir (seven; pins landed with #15/#18 waves). Note: the
#     attribute scopes to its crate target only — tests/ files are
#     separate crate roots and rely on the deny'd lint instead.
#     scripts/unsafe_report.sh is the
#     ratchet: baseline in docs/unsafe-baseline.txt, --diff mode blocks new
#     unsafe occurrences in changed files.
