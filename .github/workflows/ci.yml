name: ci
# ROBUSTNESS-CI leaf 00.01 - core pipeline mirroring the local gate stack
# (plans/robustness-ci/master.md findings #1 #2 #3 #6 #19 #20; audit sketch
# .hermes/audits/robustness-review-2026-10-19.md "Proposed CI pipeline").
#
# Jobs here: fast-lints (pytest lints + notices drift), rust (pinned fmt /
# informational clippy / build / test), deny (cargo-deny, master.md:45
# promise). attribution.yml stays alive until the orchestrator retires it
# after this file lands - its notices gate is duplicated in fast-lints so
# retirement is a pure delete.
#
# Toolchain contract (master.md interface table): rustc 1.94.0 pinned via
# dtolnay/rust-toolchain@master, matching rust-toolchain.toml:6. Homebrew
# cargo ignores rust-toolchain.toml locally, so the pin is asserted
# explicitly with `rustc -vV` (finding #6: "pin is decorative").
#
# setup-python step-0 (verified 2026-10-19 from actions/python-versions
# versions-manifest.json via gh api): Python 3.14 GA ships 3.14.6/3.14.7/
# 3.14.8 for linux 22.04/24.04/26.04 x64+arm64; ubuntu-latest runners
# pre-bake 3.14 in the tool cache. setup-python@v5 (latest v5.5.0) resolves
# "3.14" natively - no pre-release flag, no setup-uv fallback needed.
on:
  push:
    branches: [main]
  pull_request:

env:
  # Takes effect once leaf 00.02 lands the shared reference-discovery helper
  # that converts "python3.14 missing" skips into hard failures. Harmless
  # today (nothing reads it yet); setting it here so 00.02 activates without
  # a workflow edit. master.md contract: every CI job running differential
  # tests sets this.
  AP_REQUIRE_REFERENCE: "1"
  CARGO_TERM_COLOR: always

jobs:
  fast-lints:
    # No workspace compile: pytest rule-lints + notices drift gate.
    # The xtask build is a single small crate (dep: cargo_metadata only).
    name: fast lints (traceability + notices)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        # fast-lints pins the exact patch: the stdlib-provenance manifest
        # records upstream sha256 from CPython 3.14.7; `python-version:
        # "3.14"` would resolve to whatever GA patch is newest and red the
        # gate on benign upstream churn (robustness-ci 03.02 gap note).
        with:
          python-version: "3.14.7"
      - name: Show interpreter
        run: python --version
      - name: Install pytest
        run: pip install pytest
      - name: C-02 corpus traceability lint (finding #19)
        run: pytest tests/corpus_traceability -q --no-header
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94.0"
      - uses: Swatinem/rust-cache@v2
      - name: THIRD_PARTY_NOTICES drift gate (moved from attribution.yml)
        run: cargo run -p xtask -- notices --check
      - name: vendored_stdlib provenance drift gate (robustness-ci 03.02)
        # Compares tracked vendored_stdlib files against the setup-python
        # 3.14 Lib/ (sysconfig probe); undeclared drift exits 1.
        run: cargo run -p xtask -- stdlib-provenance --check

  rust:
    name: rust 1.94.0 (fmt / clippy-info / build / test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pin toolchain (rust-toolchain.toml:6; finding #6)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94.0"
          components: rustfmt, clippy
      - name: Assert toolchain pin took effect
        run: |
          rustc -vV
          rustc -vV | grep -q "rustc 1\.94\.0" \
            || { echo "::error::expected rustc 1.94.0, got: $(rustc -vV | head -1)"; exit 1; }
      - name: Python 3.14 reference interpreter (differential Rust tests)
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Export reference path
        # Belt-and-braces for the master.md "reference python discovery"
        # contract; 00.02's helper reads this env var first.
        run: echo "AP_CONFORM_REFERENCE_PYTHON=$(command -v python3.14 || command -v python)" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt (blocking)
        run: cargo fmt --all --check
      - name: cargo clippy (INFORMATIONAL - see comment)
        # Strict `-D warnings` is leaf 02.01's deliverable: it lands the
        # [workspace.lints] policy (unwrap_used allow-lists, clippy.toml)
        # first, then flips this step to blocking. The tree is not
        # clippy-clean today (finding #7: 149 unwrap() panic surfaces in
        # ap-obj/ap-run), so a hard gate here would be red-on-merge for
        # every PR. This wrapper never fails the job but surfaces the
        # warning count as a visible workflow warning - do not water the
        # lint down by deleting lints to silence it (02.01 owns cleanup).
        run: |
          if cargo clippy --workspace --all-targets 2>&1 | tee clippy.log | grep -q "^warning"; then
            n=$(grep -c "^warning:" clippy.log || true)
            echo "::warning::cargo clippy reported ${n} warnings (informational; strict -D warnings gate lands with leaf 02.01)"
          else
            echo "cargo clippy: clean"
          fi
          exit 0
      - name: cargo build (bins consumed by integration tests via target/debug path math)
        run: cargo build --workspace
      - name: cargo test
        run: cargo test --workspace
      - name: cargo doc -D warnings (robustness-ci 05.03)
        # Broken intra-doc links + missing_docs where opted in
        # ([workspace.lints.rustdoc] + ap-conform/ap-ir crate warns).
        # 4-crate scope: ap-run's 14 remaining doc warnings all sit in
        # sibling-02.07 dirty files; it joins via 05.03b once that lands
        # (fix recipe in plans/robustness-ci/05-cli-docs/PROGRESS.md).
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --no-deps -p ap-obj -p ap-ir -p ap-parse -p ap-conform
      - name: cli-docs drift gate (robustness-ci 05.04)
        # docs/testability-clis.md must equal the live --help of the
        # built bins; drift exits 1.
        run: cargo run -p xtask -- cli-docs --check

  deny:
    name: cargo deny (master.md:45; finding #2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: cargo deny check
        run: cargo deny check

  conformance-matrix:
    # Leaf 00.03 helper: picks the OS axis for `conformance`. The brief's
    # "guard macos with a job-level if" is not expressible - a job-level
    # `if` is evaluated BEFORE the matrix context exists (actions/runner
    # issue #1985), so it would skip every OS or none. The per-event axis
    # therefore has to be computed here (seconds, ubuntu) and fed to the
    # matrix via fromJSON.
    name: conformance os-axis
    runs-on: ubuntu-latest
    outputs:
      oses: ${{ steps.pick.outputs.oses }}
    steps:
      - name: Pick OSes for this event
        id: pick
        run: |
          # macOS runner cost note (audit "Proposed CI pipeline"): macos-14
          # hosted runners bill ~10x ubuntu-latest, so the differential
          # track runs on macOS ONLY for main pushes; PRs verify on ubuntu.
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF" = "refs/heads/main" ]; then
            echo 'oses=["ubuntu-latest","macos-14"]' >> "$GITHUB_OUTPUT"
          else
            echo 'oses=["ubuntu-latest"]' >> "$GITHUB_OUTPUT"
          fi

  conformance:
    # Leaf 00.03 - the pytest differential track (byte-exact corpus gate).
    # Trustworthy post-00.02: the Rust suites consumed by this tree panic
    # red on a missing reference under the workflow-level
    # AP_REQUIRE_REFERENCE=1, and the env-honoring pytest suites get
    # AP_CONFORM_REFERENCE_PYTHON from the export step below.
    name: conformance pytest (${{ matrix.os }})
    needs: [rust, conformance-matrix]
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.conformance-matrix.outputs.oses) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180  # full differential track measured ~1h locally
    steps:
      - uses: actions/checkout@v4
      - name: Pin toolchain (rust-toolchain.toml:6; finding #6)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94.0"
      - name: Python 3.14 reference interpreter
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Export reference path
        # Reads per master.md "reference python discovery" contract:
        # 00.02's Rust helper checks this env var FIRST; pytest suites
        # t06/t07/t08/t09/t11/t16/fstrings_corpus read it as REF_PY.
        run: echo "AP_CONFORM_REFERENCE_PYTHON=$(command -v python3.14 || command -v python)" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
      - name: cargo build (pytest suites path-resolve target/debug bins)
        # INTEGRATION/CONFORMANCE TESTS PATH-MATH INTO target/debug:
        # t05/t07/t08/t11/_find_bin fall back to REPO_ROOT/target/{debug,
        # release}/ap-conform, and APX_IMPL/APX_CLI below point into the
        # same dir. The build MUST precede pytest (separate runner from the
        # `rust` job, so nothing is shared).
        run: cargo build --workspace
      - name: Install pytest
        run: pip install pytest
      - name: pytest differential track
        # Env names verified against the suites (not the brief's guesses):
        #   APX_IMPL  - t05:77 t07:117 t08:125 t10:77 t11:108 t16 - the
        #               ap-conform --impl seam; target/debug/ap-run-eval
        #               accepts exactly the `--tier 0` ap-conform appends
        #               (crates/ap-cli/src/bin/ap_run_eval.rs:4-7).
        #   APX_CLI   - t09:158 t14:80 t15:63 t16:126 - the `antipythany`
        #               driver (build/run verbs).
        # Relative paths are safe: suites run subprocesses with
        # cwd=REPO_ROOT and pytest itself runs from the checkout root.
        env:
          APX_IMPL: "target/debug/ap-run-eval"
          APX_CLI: "target/debug/antipythany run"
        run: |
          set -o pipefail
          python -m pytest tests/ -q --no-header -rX \
            | tee "$RUNNER_TEMP/pytest_report.txt"
      - name: XPASS ceiling gate (leaf 01.01)
        # tests/XPASS_CEILING is monotone-decreasing; a run reporting
        # MORE xpasses than the ceiling means a stale strict=False
        # marker grew - fail, and 01.02 flips the owning tests.
        run: python tests/tools/_xpass_gate.py "$RUNNER_TEMP/pytest_report.txt"
      - name: ap-conform per-family corpus counts (job summary)
        if: always()
        # Optional nicety (leaf 00.03 brief): reference-vs-reference
        # self-comparison per family, printed via ap-conform --json
        # (`summary.{total,passed,failed,errors,timeouts}`, the same JSON
        # shape t05 asserts at tests/t05_values/test_t05_values.py:202-215).
        # Report-only; jq is preinstalled on GH-hosted runners. Runs even
        # when pytest is red - the counts are most useful then.
        run: |
          echo "## ap-conform corpus inventory (reference self-check)" >> "$GITHUB_STEP_SUMMARY"
          echo "| family | total | passed | failed | errors | timeouts |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|---|---|---|---|" >> "$GITHUB_STEP_SUMMARY"
          for fam in values classes exceptions gc fstrings stdlib threading tier1-transparency; do
            if target/debug/ap-conform run --corpus "tests/corpus/${fam}/*.py" \
                 --impl "${AP_CONFORM_REFERENCE_PYTHON:-python3.14}" --json \
                 > "/tmp/conform-${fam}.json" 2>/dev/null; then
              jq -r '.summary as $s | "| '"${fam}"' | \($s.total) | \($s.passed) | \($s.failed) | \($s.errors) | \($s.timeouts) |"' \
                "/tmp/conform-${fam}.json" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "| ${fam} | - | - | - | - | ap-conform run failed |" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
          exit 0
