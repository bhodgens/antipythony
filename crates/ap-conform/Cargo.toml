[package]
name = "ap-conform"
description = "differential conformance runner (spawns CPython)"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "ap-conform"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
glob = "0.3"

[dev-dependencies]
# 2026-11-06 harness review: flock single-tenancy gate in harness_selfcheck
# (same seam/lock file as ap-run/ap-cli/ap-obj tests/common).
libc = "0.2"

[lints]
workspace = true  # robustness-ci 02.01 - see root Cargo.toml [workspace.lints]
