[package]
name = "ap-codegen-wasm"
description = "ap-ir to WasmGC module"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[lints]
workspace = true  # robustness-ci 02.01 - see root Cargo.toml [workspace.lints]

[dependencies]
ap-ir = { path = "../ap-ir" }
wasm-encoder = "0.263.0"

[dev-dependencies]
wasmparser = "0.263"
ap-host = { path = "../ap-host" }

[[bin]]
name = "diag_host"
path = "src/bin/diag_host.rs"
