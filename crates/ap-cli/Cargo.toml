[package]
name = "ap-cli"
description = "the antipythany binary (run/build/new verbs)"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
ap-run = { path = "../ap-run" }

[[bin]]
name = "antipythany"
path = "src/main.rs"

[[bin]]
name = "ap-run-eval"
path = "src/bin/ap_run_eval.rs"

[[bin]]
name = "ap-obj-eval"
path = "src/bin/ap_obj_eval.rs"

[lints]
workspace = true  # robustness-ci 02.01 - see root Cargo.toml [workspace.lints]
