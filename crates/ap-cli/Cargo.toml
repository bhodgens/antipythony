[package]
name = "ap-cli"
description = "the antipythony binary (run/build/new verbs)"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
ap-pack = { path = "../ap-pack" }
ap-run = { path = "../ap-run" }
# 02.06: the AoT build pipeline (cfg lowering + cranelift-object + link).
ap-codegen-native = { path = "../ap-codegen-native" }
# 04.04: the wasm build shape + the `host` verb (embedded ap-host runner).
ap-codegen-wasm = { path = "../ap-codegen-wasm" }
ap-host = { path = "../ap-host" }
# 04.05: the hybrid payload object emitter (cranelift-object data sections,
# same 0.134 line the workspace pins).
cranelift = "0.134"
cranelift-module = "0.134"
cranelift-object = "0.134"
cranelift-native = "0.134"
ap-parse = { path = "../ap-parse" }
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
# packaging_differential: fixture wheel construction (native-component add
# refusal probe). Built as a zip in-test, never committed.
zip = { version = "2", default-features = false, features = ["deflate"] }
# 2026-11-06 OOM mitigation: tests/common fence (proc_pid_rusage + flock).
libc = "0.2"

[[bin]]
name = "antipythony"
path = "src/main.rs"
# 10.02: export the Py* C-API symbols so dlopen'd extensions resolve them
# against the running process (the source-shim loading model).

[[bin]]
name = "ap-run-eval"
path = "src/bin/ap_run_eval.rs"

[[bin]]
name = "ap-obj-eval"
path = "src/bin/ap_obj_eval.rs"

[lints]
workspace = true  # robustness-ci 02.01 - see root Cargo.toml [workspace.lints]
