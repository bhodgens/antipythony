[package]
name = "ap-cli"
description = "the antipythony binary (run/build/new verbs)"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
ap-pack = { path = "../ap-pack" }
ap-run = { path = "../ap-run" }
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
# packaging_differential: fixture wheel construction (native-component add
# refusal probe). Built as a zip in-test, never committed.
zip = { version = "2", default-features = false, features = ["deflate"] }

[[bin]]
name = "antipythony"
path = "src/main.rs"

[[bin]]
name = "ap-run-eval"
path = "src/bin/ap_run_eval.rs"

[[bin]]
name = "ap-obj-eval"
path = "src/bin/ap_obj_eval.rs"

[lints]
workspace = true  # robustness-ci 02.01 - see root Cargo.toml [workspace.lints]
