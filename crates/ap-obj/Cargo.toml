[package]
name = "ap-obj"
description = "Python object model (values, types, dispatch, exceptions)"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
# Arbitrary-precision integers (C-12/C-13): limb-based, battle-tested; gives
# `<< >> & | ^ pow` with CPython's floor/arithmetic semantics for negatives
# out of the box. num-bigint 0.4.6 is vendored in the local registry cache.
num-bigint = "0.4"
num-integer = "0.1"
num-traits = "0.2"

[lints]
workspace = true  # robustness-ci 02.01 - see root Cargo.toml [workspace.lints]

[dev-dependencies]
# robustness-ci leaf 04.02: differential repr fuzz vs live CPython 3.14.
# MIT (deny.toml allow-list covers it). Feature flags mirror leaf 04.01's
# ap-run choice exactly (single resolved proptest in the graph): fork-based
# panic recovery is dead weight for in-process compares and a macOS fork
# hazard; std is all we need.
proptest = { version = "1", default-features = false, features = ["std"] }
