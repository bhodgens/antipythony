[package]
name = "ap-run"
description = "tier-0 baseline executor over ap-ir using ap-obj"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

# Per-probe executor for the differential test suites (OOM mitigation,
# 2026-11-05): suites spawn this bin via CARGO_BIN_EXE_ instead of running
# the interpreter in-process, so each probe's GC heap dies with its process.
# Mirrors crates/ap-cli/src/bin/ap_run_eval.rs (kept separate so ap-run's
# tests do not depend on ap-cli and vice versa).
[[bin]]
name = "ap-run-probe"
path = "src/bin/ap_run_probe.rs"

[dependencies]
ap-gc = { path = "../ap-gc" }
ap-ir = { path = "../ap-ir" }
ap-obj = { path = "../ap-obj" }
ap-pack = { path = "../ap-pack" }
ap-parse = { path = "../ap-parse" }
# 02.05a: the JIT entry hook (cfg lower + baseline compile + ExecCtx run).
ap-codegen-native = { path = "../ap-codegen-native" }
ruff_python_ast = "0.0.4"
ruff_text_size = "0.0.4"
# bigint base conversion fallbacks (hex/oct/bin beyond u128)
num-bigint = "0.4"
num-integer = "0.1"
num-traits = "0.2"

# hashlib (02.08-lite; task brief overrides the S-05-19 OUT marking — see
# builtins_modules.rs head note for the spec-divergence flag)
libm = "0.2"
md-5 = "0.10"
sha1 = "0.10"
sha2 = "0.10"
# A-2 (RustPython adaptation wave 2): sha3/shake (RustCrypto sha3) +
# blake2b/blake2s (RustCrypto blake2) for the hashlib algorithm layer;
# flate2 for the zlib one-shot surface (adler32/crc32/compress/decompress).
sha3 = "0.10"
blake2 = "0.10"
flate2 = "1"

# T1 (w3lib.url): native unicodedata.normalize (NFC/NFD/NFKC/NFD) for the
# vendored URL-cleanup path. Crate is in the offline registry cache.
unicode-normalization = "0.1"
corosensei = "0.3.4"

# A-1 (RustPython adaptation wave 1): os.pipe/pipe2, os.kill/killpg,
# utimensat-based os.utime — direct libc syscalls, following the donor's
# host_env/posix.rs layer (RustPython hosts them behind nix; we call libc
# directly to avoid the extra dependency).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[lints]
workspace = true  # robustness-ci 02.01 - see root Cargo.toml [workspace.lints]

[dev-dependencies]
# robustness-ci leaf 04.01: property-based differential fuzz for the re
# engine. MIT (deny.toml allow-list covers it). default-features off: we
# compare out-of-process binaries, so proptest's fork-based panic recovery
# (rusty-fork) is dead weight and a macOS fork hazard; std is all we need.
proptest = { version = "1", default-features = false, features = ["std"] }
