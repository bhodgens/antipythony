[package]
name = "ap-run"
description = "tier-0 baseline executor over ap-ir using ap-obj"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
ap-ir = { path = "../ap-ir" }
ap-obj = { path = "../ap-obj" }
ap-parse = { path = "../ap-parse" }
# bigint base conversion fallbacks (hex/oct/bin beyond u128)
num-bigint = "0.4"
num-integer = "0.1"
num-traits = "0.2"
