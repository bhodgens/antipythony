# cargo-deny configuration for antipythony.
#
# Run: `cargo deny check licenses` (or `cargo deny check` for everything).
# The xtask notices gate (`cargo run -p xtask -- notices --check`) covers the
# THIRD_PARTY_NOTICES freshness; this file covers license policy.
#
# Policy: permissive licenses only in the dependency graph. Project license is
# Apache-2.0 WITH LLVM-exception.
#
# NOTE: Nuitka (AGPL-3.0) is a subprocess tool ONLY in this project - it is
# never a Cargo dependency and must never appear in Cargo.lock. If a package
# named `nuitka` ever shows up here, that is a bug: stop and investigate.
#
# Documented dev-only exceptions (build/test tooling only, never linked into
# shipped artifacts) go in the `exceptions` table below with a comment naming
# the leaf that documented them.

[graph]
all-features = true

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "BSD-2-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CDLA-Permissive-2.0",
]
# NOTE: cargo-deny PR 611 removed the `licenses.deny` key — the copyleft
# policy below is enforced via the allow-list (everything not in `allow`
# is rejected) plus the documented MPL-2.0 exception posture.
# Deny-list preserved here as documentation of the original policy:
#   GPL-1.0/2.0/3.0, AGPL-1.0/3.0, LGPL-2.0/2.1/3.0, MPL-1.1/2.0,
#   CC-BY-SA-1.0/2.0/2.5/3.0/4.0, SSPL-1.0, EUPL-1.1/1.2
# MPL-2.0 is file-level copyleft and normally compatible, but it is denied
confidence-threshold = 0.93

[[licenses.exceptions]]
# Documented dev-only exceptions go here. Empty for now.
allow = []
crate = ""

# FINISHER-SWEEP (2026-11-24): the advisory DB grew 46 RustSec entries
# against our pinned stack the week this sweep ran. wasmtime 47 is
# version-PINNED (spec 07 EH contract needs >= 47; 48+ breaks the
# exceptions design) — the wasmtime/wasi/zip/url advisories are
# inventory, not actionable: they need a coordinated wasmtime upgrade
# (its own leaf), not silent ignoring. Ignore with notes; revisit when
# wasmtime >= next-major with these fixes lands.

[advisories]
version = 2
yanked = "deny"
ignore = [
    # wasmtime 47.0.4 family (PINNED by spec 07 EH contract; upgrade = own leaf)
    "RUSTSEC-2026-0314", "RUSTSEC-2026-0315", "RUSTSEC-2026-0316",
